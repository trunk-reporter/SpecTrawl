[package]
name = "spectrawl-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "spectrawl_app"
path = "src/lib.rs"

[dependencies]
api = { path = "../api", features = ["serde"] }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11", "persistence"] }
egui = "0.36.2"
egui_dock = { version = "0.21", features = ["serde"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
arc-swap = "1.7"
egui_kittest = "0.36.2"
backend-sim = { path = "../backend-sim" }
engine = { path = "../engine" }
sdr-core = { path = "../sdr-core" }
